name: Build and Push Docker Image
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs: 
  build:
    runs-on: ubuntu-latest 
    steps:

      # Paso 1: Checkout del repositorio (Actualizado a v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Paso 2: Autenticar en DockerHub (Actualizado a la versión estable v3)
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Paso 3: Construir la imagen de Docker
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest .

      # Paso 4: Hacer push de la imagen a DockerHub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
          
      # Paso 5: Configurar credenciales de AWS (Actualizado a v4)
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      # Paso 5.5: Agregar Llave SSH de forma segura
      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Paso 6: Conectarse a EC2, transferir las llaves y desplegar el contenedor
      - name: SSH commands to deploy
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HOST_IP: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.USER_SERVER }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SSH_USER@$HOST_IP << EOF
            # Autenticar en DockerHub desde EC2 usando las variables del entorno
            echo "$DOCKER_TOKEN" | sudo docker login -u "$DOCKER_USER" --password-stdin
            
            # Descargar la última versión de la imagen
            sudo docker pull $DOCKER_USER/my-app:latest
            
            # Parar y eliminar cualquier contenedor previo
            sudo docker stop my-app || true
            sudo docker rm my-app || true
            
            # Iniciar el contenedor pasándole las variables de entorno para S3
            sudo docker run -d --name my-app \
              -p 8080:8080 \
              -e AWS_ACCESS_KEY_ID="$AWS_KEY" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET" \
              -e AWS_SESSION_TOKEN="$AWS_TOKEN" \
              $DOCKER_USER/my-app:latest
          EOF
